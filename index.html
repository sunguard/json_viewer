<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1e1e2e;
      --surface: #181825;
      --surface2: #313244;
      --border: #45475a;
      --text: #cdd6f4;
      --text-muted: #6c7086;
      --accent: #89b4fa;
      --green: #a6e3a1;
      --yellow: #f9e2af;
      --red: #f38ba8;
      --pink: #f5c2e7;
      --teal: #94e2d5;
      --mauve: #cba6f7;
      --radius: 8px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    header .badge {
      font-size: 0.7rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 99px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .toolbar input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: 0.85rem;
      outline: none;
      width: 200px;
      transition: border-color 0.15s;
    }

    .toolbar input[type="text"]::placeholder { color: var(--text-muted); }
    .toolbar input[type="text"]:focus { border-color: var(--accent); }

    .btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 6px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--border); border-color: var(--accent); }
    .btn.primary { background: var(--accent); color: #1e1e2e; border-color: var(--accent); font-weight: 600; }
    .btn.primary:hover { opacity: 0.88; }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      flex: 1;
      overflow: hidden;
    }

    @media (max-width: 860px) {
      .main { grid-template-columns: 1fr; }
    }

    .pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .pane:last-child { border-right: none; }

    .pane-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .pane-header .stats {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    textarea {
      flex: 1;
      background: var(--surface);
      border: none;
      color: var(--text);
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      line-height: 1.6;
      padding: 16px;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    textarea::placeholder { color: var(--text-muted); }

    .error-bar {
      background: color-mix(in srgb, var(--red) 15%, transparent);
      border-top: 1px solid var(--red);
      color: var(--red);
      padding: 8px 14px;
      font-size: 0.82rem;
      display: none;
    }
    .error-bar.visible { display: block; }

    .output-pane {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 0.86rem;
      line-height: 1.6;
      background: var(--surface);
    }

    .output-pane .placeholder {
      color: var(--text-muted);
      font-family: 'Segoe UI', system-ui, sans-serif;
      text-align: center;
      margin-top: 60px;
      font-size: 0.92rem;
    }

    .output-pane .placeholder .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    /* Tree nodes */
    .node { display: block; }
    .node-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
      padding: 1px 0;
      border-radius: 4px;
      cursor: default;
      white-space: nowrap;
    }
    .node-row:hover { background: var(--surface2); }

    .toggle {
      cursor: pointer;
      user-select: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      width: 14px;
      text-align: center;
      flex-shrink: 0;
      transition: transform 0.12s;
    }
    .toggle.collapsed { transform: rotate(-90deg); }

    .node-children {
      padding-left: 20px;
      border-left: 1px solid var(--border);
      margin-left: 6px;
    }
    .node-children.collapsed { display: none; }

    .key { color: var(--accent); }
    .colon { color: var(--text-muted); }
    .brace { color: var(--text); }
    .bracket { color: var(--yellow); }
    .comma { color: var(--text-muted); }

    .val-string { color: var(--green); }
    .val-number { color: var(--mauve); }
    .val-boolean { color: var(--red); }
    .val-null { color: var(--text-muted); font-style: italic; }

    .type-badge {
      font-size: 0.68rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 5px;
      margin-left: 4px;
      cursor: default;
    }

    .summary {
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.82rem;
      margin-left: 4px;
    }

    .highlight { background: color-mix(in srgb, var(--yellow) 30%, transparent); border-radius: 2px; }

    .search-count {
      font-size: 0.75rem;
      color: var(--teal);
    }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }
  </style>
</head>
<body>

<header>
  <h1>JSON Viewer</h1>
  <span class="badge">v1.0</span>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search keys or values…" />
    <span class="search-count" id="searchCount"></span>
    <button class="btn" id="expandAll">Expand All</button>
    <button class="btn" id="collapseAll">Collapse All</button>
    <button class="btn" id="formatBtn">Format</button>
    <button class="btn" id="clearBtn">Clear</button>
    <label class="btn" style="cursor:pointer;">
      Load File
      <input type="file" accept=".json,application/json,text/plain" id="fileInput" style="display:none" />
    </label>
    <button class="btn primary" id="parseBtn">Parse ▶</button>
  </div>
</header>

<div class="main">
  <div class="pane">
    <div class="pane-header">
      <span>JSON Input</span>
      <span class="stats" id="inputStats"></span>
    </div>
    <textarea id="editor" placeholder='Paste JSON here… e.g. {"name":"Alice","scores":[10,20,30]}'></textarea>
    <div class="error-bar" id="errorBar"></div>
  </div>

  <div class="pane">
    <div class="pane-header">
      <span>Tree View</span>
      <span class="stats" id="treeStats"></span>
    </div>
    <div class="output-pane" id="output">
      <div class="placeholder">
        <div class="icon">{ }</div>
        <p>Paste JSON on the left and click <strong>Parse</strong></p>
        <p style="margin-top:6px;font-size:0.82rem;">or load a .json file</p>
      </div>
    </div>
  </div>
</div>

<footer>
  <span>Keyboard: <strong>Ctrl+Enter</strong> to parse</span>
  <span>Click <strong>▶</strong> toggle to collapse/expand nodes</span>
  <span>Click values to copy to clipboard</span>
</footer>

<script>
  const editor = document.getElementById('editor');
  const output = document.getElementById('output');
  const errorBar = document.getElementById('errorBar');
  const searchInput = document.getElementById('searchInput');
  const searchCount = document.getElementById('searchCount');
  const inputStats = document.getElementById('inputStats');
  const treeStats = document.getElementById('treeStats');

  let parsedData = null;
  let nodeCount = 0;
  let matchCount = 0;

  // ── Parse & Render ─────────────────────────────────────────────────────────

  function parse() {
    const raw = editor.value.trim();
    errorBar.classList.remove('visible');
    if (!raw) { output.innerHTML = '<div class="placeholder"><div class="icon">{ }</div><p>Nothing to parse.</p></div>'; parsedData = null; updateStats(); return; }

    try {
      parsedData = JSON.parse(raw);
      nodeCount = 0;
      output.innerHTML = '';
      output.appendChild(renderNode(parsedData, null, true, false));
      updateStats();
    } catch (e) {
      errorBar.textContent = '✖ ' + e.message;
      errorBar.classList.add('visible');
    }
  }

  function renderNode(value, key, isLast, isArrayItem) {
    const wrapper = document.createElement('div');
    wrapper.className = 'node';
    nodeCount++;

    const type = getType(value);

    if (type === 'object' || type === 'array') {
      const open = type === 'object' ? '{' : '[';
      const close = type === 'object' ? '}' : ']';
      const entries = type === 'object' ? Object.entries(value) : value.map((v, i) => [i, v]);
      const count = entries.length;

      const row = document.createElement('div');
      row.className = 'node-row';

      const toggle = document.createElement('span');
      toggle.className = 'toggle';
      toggle.textContent = '▶';

      const label = document.createElement('span');
      label.innerHTML =
        (key !== null ? `<span class="key">${escHtml(String(key))}</span><span class="colon">: </span>` : '') +
        `<span class="${type === 'array' ? 'bracket' : 'brace'}">${open}</span>`;

      const summary = document.createElement('span');
      summary.className = 'summary';
      summary.textContent = count === 0 ? '' : `${count} ${count === 1 ? (type === 'array' ? 'item' : 'key') : (type === 'array' ? 'items' : 'keys')}`;

      const badge = document.createElement('span');
      badge.className = 'type-badge';
      badge.title = 'type';
      badge.textContent = type;

      row.append(toggle, label, summary, badge);
      wrapper.appendChild(row);

      const children = document.createElement('div');
      children.className = 'node-children';

      entries.forEach(([k, v], idx) => {
        children.appendChild(renderNode(v, type === 'array' ? null : k, idx === entries.length - 1, type === 'array'));
      });

      // Close brace row
      const closeRow = document.createElement('div');
      closeRow.className = 'node-row';
      closeRow.innerHTML = `<span class="${type === 'array' ? 'bracket' : 'brace'}">${close}</span>${!isLast ? '<span class="comma">,</span>' : ''}`;

      wrapper.append(children, closeRow);

      if (count === 0) {
        toggle.style.visibility = 'hidden';
        summary.textContent = '';
      }

      toggle.addEventListener('click', () => {
        const collapsed = children.classList.toggle('collapsed');
        toggle.classList.toggle('collapsed', collapsed);
        summary.style.display = collapsed ? 'inline' : 'none';
        summary.textContent = collapsed
          ? (type === 'array' ? `[…${count}]` : `{…${count}}`)
          : (count === 0 ? '' : `${count} ${count === 1 ? (type === 'array' ? 'item' : 'key') : (type === 'array' ? 'items' : 'keys')}`);
      });

    } else {
      // Leaf
      const row = document.createElement('div');
      row.className = 'node-row';
      row.title = 'Click to copy';

      const valSpan = document.createElement('span');
      valSpan.className = `val-${type}`;

      let display;
      if (type === 'string') display = `"${escHtml(value)}"`;
      else if (type === 'null') display = 'null';
      else display = String(value);

      valSpan.innerHTML = display;

      row.innerHTML =
        (key !== null && !isArrayItem ? `<span class="key">${escHtml(String(key))}</span><span class="colon">: </span>` : '') +
        (key !== null && isArrayItem === false ? '' : (isArrayItem ? '' : ''));

      // Re-build cleanly
      row.innerHTML = '';
      const dummy = document.createElement('span');
      dummy.style.width = '14px';
      dummy.style.display = 'inline-block';
      row.appendChild(dummy);

      if (key !== null && !isArrayItem) {
        const k = document.createElement('span');
        k.className = 'key';
        k.textContent = String(key);
        const c = document.createElement('span');
        c.className = 'colon';
        c.textContent = ': ';
        row.append(k, c);
      }

      row.appendChild(valSpan);

      if (!isLast) {
        const comma = document.createElement('span');
        comma.className = 'comma';
        comma.textContent = ',';
        row.appendChild(comma);
      }

      const badge = document.createElement('span');
      badge.className = 'type-badge';
      badge.textContent = type;
      row.appendChild(badge);

      row.addEventListener('click', () => copyToClipboard(value, row));

      wrapper.appendChild(row);
    }

    return wrapper;
  }

  // ── Utilities ──────────────────────────────────────────────────────────────

  function getType(v) {
    if (v === null) return 'null';
    if (Array.isArray(v)) return 'array';
    return typeof v;
  }

  function escHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function copyToClipboard(val, el) {
    const text = typeof val === 'string' ? val : JSON.stringify(val);
    navigator.clipboard.writeText(text).then(() => {
      const orig = el.style.background;
      el.style.background = 'color-mix(in srgb, var(--teal) 20%, transparent)';
      setTimeout(() => el.style.background = orig, 600);
    }).catch(() => {});
  }

  function updateStats() {
    const text = editor.value;
    const lines = text ? text.split('\n').length : 0;
    const bytes = new Blob([text]).size;
    inputStats.textContent = text ? `${lines} lines · ${formatBytes(bytes)}` : '';
    treeStats.textContent = parsedData !== null ? `${nodeCount} nodes` : '';
  }

  function formatBytes(b) {
    if (b < 1024) return `${b} B`;
    if (b < 1024 * 1024) return `${(b/1024).toFixed(1)} KB`;
    return `${(b/1024/1024).toFixed(1)} MB`;
  }

  // ── Search ─────────────────────────────────────────────────────────────────

  let searchTimeout;

  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(doSearch, 200);
  });

  function doSearch() {
    const q = searchInput.value.trim().toLowerCase();
    // Remove old highlights
    output.querySelectorAll('.highlight').forEach(el => {
      el.outerHTML = el.textContent;
    });

    if (!q || !parsedData) { searchCount.textContent = ''; return; }

    let hits = 0;
    const walker = document.createTreeWalker(output, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) textNodes.push(node);

    textNodes.forEach(tn => {
      const val = tn.textContent;
      const idx = val.toLowerCase().indexOf(q);
      if (idx === -1) return;
      const span = document.createElement('span');
      span.innerHTML =
        escHtml(val.slice(0, idx)) +
        `<span class="highlight">${escHtml(val.slice(idx, idx + q.length))}</span>` +
        escHtml(val.slice(idx + q.length));
      tn.replaceWith(span);
      hits++;
    });

    searchCount.textContent = hits ? `${hits} match${hits > 1 ? 'es' : ''}` : 'no matches';
  }

  // ── Format ─────────────────────────────────────────────────────────────────

  document.getElementById('formatBtn').addEventListener('click', () => {
    try {
      const obj = JSON.parse(editor.value);
      editor.value = JSON.stringify(obj, null, 2);
      updateStats();
    } catch (e) {
      errorBar.textContent = '✖ ' + e.message;
      errorBar.classList.add('visible');
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    editor.value = '';
    output.innerHTML = '<div class="placeholder"><div class="icon">{ }</div><p>Paste JSON on the left and click <strong>Parse</strong></p></div>';
    errorBar.classList.remove('visible');
    parsedData = null;
    searchInput.value = '';
    searchCount.textContent = '';
    updateStats();
  });

  document.getElementById('expandAll').addEventListener('click', () => {
    output.querySelectorAll('.node-children').forEach(el => el.classList.remove('collapsed'));
    output.querySelectorAll('.toggle').forEach(el => el.classList.remove('collapsed'));
  });

  document.getElementById('collapseAll').addEventListener('click', () => {
    const children = output.querySelectorAll('.node-children');
    // Only collapse non-root
    Array.from(children).slice(0).forEach(el => el.classList.add('collapsed'));
    output.querySelectorAll('.toggle').forEach(el => el.classList.add('collapsed'));
  });

  document.getElementById('parseBtn').addEventListener('click', parse);

  editor.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); parse(); }
  });

  editor.addEventListener('input', updateStats);

  // ── File Load ──────────────────────────────────────────────────────────────

  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      editor.value = ev.target.result;
      updateStats();
      parse();
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ── Sample data on load ────────────────────────────────────────────────────

  const sample = {
    "name": "Alice",
    "age": 30,
    "active": true,
    "score": null,
    "tags": ["developer", "open-source", "JSON"],
    "address": {
      "city": "San Francisco",
      "zip": "94105",
      "coords": { "lat": 37.7749, "lng": -122.4194 }
    },
    "projects": [
      { "id": 1, "title": "JSON Viewer", "stars": 42 },
      { "id": 2, "title": "CLI Tools", "stars": 17 }
    ]
  };

  editor.value = JSON.stringify(sample, null, 2);
  updateStats();
  parse();
</script>
</body>
</html>
